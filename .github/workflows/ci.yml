name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alquilerapp
          POSTGRES_PASSWORD: alquilerapp
          POSTGRES_DB: alquilerapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alquilerapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://alquilerapp:alquilerapp@localhost:5432/alquilerapp
      TEST_DATABASE_URL: postgresql+psycopg://alquilerapp:alquilerapp@localhost:5432/alquilerapp_test
      REDIS_URL: redis://localhost:6379/0
      MESSAGING_MODE: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.8"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # --locked: install exactly what uv.lock pins; fail if the lock is out of date with pyproject.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: OpenAPI schema is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx jest --ci
      - name: API client is up to date with backend/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
