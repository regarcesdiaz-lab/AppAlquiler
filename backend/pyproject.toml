[project]
name = "alquilerapp-backend"
version = "0.1.0"
description = "AlquilerApp API, agents and messaging channels"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
]

# Exact versions for every platform are pinned in uv.lock (`uv lock` to update, `uv sync` to install).
[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations folder) would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
