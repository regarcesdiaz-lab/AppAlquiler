# Dominican Republic public holidays, as observed (after the moves of Ley 139-97).
# Source: calendar published every year by the Ministerio de Trabajo (mt.gob.do).
#
# Add the next year as soon as the ministry publishes it (usually in November).
# tests/test_holidays.py fails when the year after the current one is missing.
#
# Ley 139-97 moves Reyes, Duarte, Día del Trabajo and Constitución to a Monday when they fall
# Tuesday to Friday. Año Nuevo, Altagracia, Independencia, Viernes Santo, Corpus Christi,
# Restauración, Mercedes and Navidad are never moved.

