# Local data services only. The backend runs on the host with uvicorn.
# For a cloud database/Redis, just point DATABASE_URL / REDIS_URL in backend/.env elsewhere.
name: alquilerapp

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alquilerapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alquilerapp}
      POSTGRES_DB: ${POSTGRES_DB:-alquilerapp}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-alquilerapp_test}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
